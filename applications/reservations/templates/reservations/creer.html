{% extends "tableau_bord/base_dashboard.html" %}

{% block title %}Nouvelle réservation{% endblock %}

{% block content %}

<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .page-header h2 {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
    }

    .form-card {
        background: white;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        padding: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    label {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 5px;
        display: block;
        font-weight: 500;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        outline: none;
        transition: 0.2s;
        background: #fff;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .full {
        grid-column: 1 / -1;
    }

    .btn-primary {
        margin-top: 20px;
        background: #2563eb;
        color: white;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
    }

    .readonly {
        background: #f8fafc;
    }
</style>

<div class="page-header">
    <h2>Demande de réservation</h2>
</div>

<div class="form-card">

    <form method="POST">
        {% csrf_token %}

        <div class="grid">

            <!-- NOM RÉSERVANT -->
            <div class="full">
                <label>Nom du réservant</label>
                <input type="text"
                       name="nom_reservant"
                       value="{{ request.user.nom_complet }}"
                       class="readonly"
                       readonly>
                <div class="hint">Utilisateur connecté automatiquement</div>
            </div>

            <!-- SALLE -->
            <div>
                <label>Salle</label>
                <select name="salle" required>
                    <option value="">-- Sélectionner une salle --</option>
                    {% for s in salles %}
                        <option value="{{ s.id }}">
                            {{ s.nom }} {% if s.filiale %}({{ s.filiale.nom }}){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- DATE -->
            <div>
                <label>Date de réunion</label>
                <input type="date" name="date_reunion" required>
            </div>

            <!-- HEURE DÉBUT -->
            <div>
                <label>Heure de début</label>
                <input type="time" name="heure_debut" required>
            </div>

            <!-- HEURE FIN -->
            <div>
                <label>Heure de fin</label>
                <input type="time" name="heure_fin" required>
            </div>

            <!-- PRÉCISIONS -->
            <div class="full">
                <label>Précisions spécifiques</label>
                <textarea name="precisions"
                          placeholder="Ex : café, matériel, disposition salle..."></textarea>
            </div>

        </div>

        <button type="submit" class="btn-primary">
            Envoyer la demande
        </button>

    </form>

</div>

{% endblock %}
