{% extends "tableau_bord/base_dashboard.html" %}



{% block content %}

<style>
    .form-container {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 20px;
        max-width: 700px;
    }

    .form-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 15px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-group label {
        font-size: 12px;
        color: #64748b;
        font-weight: 600;
    }

    input, select {
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
        background: #fff;
    }

    input:focus, select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .full {
        grid-column: span 2;
    }

    .btn {
        margin-top: 15px;
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        width: 100%;
    }

    .btn:hover {
        background: #1d4ed8;
    }
</style>

<div class="form-container">

    <div class="form-title">
        Utilisateur
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username"
                       value="{{ user_obj.username|default:'' }}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       value="{{ user_obj.email|default:'' }}">
            </div>

            <div class="form-group">
                <label>Prénom</label>
                <input type="text" name="first_name"
                       value="{{ user_obj.first_name|default:'' }}">
            </div>

            <div class="form-group">
                <label>Nom</label>
                <input type="text" name="last_name"
                       value="{{ user_obj.last_name|default:'' }}">
            </div>

            {% if not user_obj %}
            <div class="form-group full">
                <label>Mot de passe</label>
                <input type="password" name="password" required>
            </div>
            {% endif %}

            <!-- ROLE FIX (IMPORTANT) -->
            <div class="form-group">
                <label>Rôle</label>
                <select name="role">
                    {% for key, value in roles %}
                        <option value="{{ key }}"
                            {% if user_obj.role == key %}selected{% endif %}>
                            {{ value }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- FILIALES FIX -->
            <div class="form-group">
                <label>Filiale</label>
                <select name="filiale">
                    <option value="">-- Groupe OSEOR --</option>
                    {% for f in filiales %}
                        <option value="{{ f.id }}"
                            {% if user_obj.filiale and user_obj.filiale.id == f.id %}selected{% endif %}>
                            {{ f.nom }}
                        </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <button class="btn" type="submit">
            Enregistrer
        </button>

    </form>

</div>

{% endblock %}
