server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Téléversements de la galerie : la limite nginx par défaut est de 1 Mo,
    # soit moins qu'une photo de téléphone. Doit rester >= TAILLE_MAX_OCTETS
    # (applications/galerie/models.py), sinon le refus tombe en 413 avant
    # même d'atteindre Django et son message d'erreur explicite.
    client_max_body_size 12M;

    # API REST Django (service "api", conteneur waitress/WSGI)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://api:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fichiers statiques Django (CSS de l'admin)
    location /static/ {
        proxy_pass http://api:8000/static/;
    }

    # Fichiers téléversés : photos de salles, de profil, signatures et
    # galerie. Servis directement depuis le volume partagé, jamais par
    # Django : avec DEBUG=False il ne les sert pas du tout, et sans cette
    # règle le « location / » ci-dessous renverrait index.html à la place
    # de l'image.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Rien d'exécutable ne doit sortir de ce répertoire, quoi qu'un
        # utilisateur soit parvenu à y déposer.
        location ~* \.(php|py|pl|sh|cgi|html?)$ {
            add_header Content-Type text/plain;
            default_type text/plain;
        }
    }

    # WebSocket notifications temps réel (service "ws", conteneur daphne)
    location /ws/ {
        proxy_pass http://ws:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA Angular : toute autre route sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
