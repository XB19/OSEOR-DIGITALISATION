server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API REST Django (service "api", conteneur waitress/WSGI)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://api:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fichiers statiques Django (CSS de l'admin)
    location /static/ {
        proxy_pass http://api:8000/static/;
    }

    # WebSocket notifications temps réel (service "ws", conteneur daphne)
    location /ws/ {
        proxy_pass http://ws:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA Angular : toute autre route sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
